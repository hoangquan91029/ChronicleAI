name: ChronicleAI CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Fonts, FFmpeg & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation build-essential ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Generate Synthetic Test Fixtures
        run: |
          python backend/sample_data/generate_sample_pdf.py

      - name: Run Test Suite with Coverage
        run: |
          export PYTHONPATH=backend
          pytest --cov=backend/app --cov-report=term-missing backend/tests

      - name: Validate Demo Ingestion Script
        run: |
          python scripts/run_demo_extraction.py
          test -s demo_output/chunks.json

      - name: Evaluate Synthetic Baseline Benchmark
        run: |
          python scripts/evaluate_synthetic_benchmark.py
          test -s benchmarks/le_thanh_tong/results.json
          test -s benchmarks/le_thanh_tong/REPORT.md

      - name: Evaluate Authentic Archival Benchmark (DVSKTT 1697)
        run: |
          python scripts/evaluate_authentic_benchmark.py
          test -s benchmarks/authentic_archival/results.json
          test -s benchmarks/authentic_archival/REPORT.md
          test -s benchmarks/authentic_archival/confusion_matrix.png

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

